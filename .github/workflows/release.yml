name: Release

on:
  # Publishing a GitHub Release is the deliberate act that ships a version:
  # it builds the binaries, attaches them to that release, pushes the image
  # to GHCR, and redeploys the Pi. `published` fires for both normal and
  # pre-releases, and does NOT fire while a release is still a draft -- so
  # you can prepare notes at your leisure and nothing happens until you hit
  # Publish.
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal default: just enough for actions/checkout. Jobs that need more
# (release: uploading assets to the GitHub Release; docker: pushing to GHCR)
# grant it to themselves below, scoped to only those jobs. This matters more
# now that pull_request can trigger this workflow, including from forks.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/unconnect/asteroids

jobs:
  test:
    # Runs on every trigger, including pull_request from forks. It only
    # checks out the ref GitHub resolves for the event and runs the local
    # test suite with no secrets in scope (no permissions beyond the
    # top-level `contents: read`) -- there's nothing here for untrusted PR
    # code to exfiltrate or abuse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pytest -v
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

  # desktop/web/docker/release stay effectively release-only: they run when a
  # GitHub Release is published, or on workflow_dispatch (which exists
  # specifically to dry-run the pipeline -- see README). They do NOT run on
  # plain pushes to main or on pull_request, so PRs only ever pay for `test`.
  #
  # The gate is `github.event_name == 'release'` rather than a check on the
  # ref. On a release event GITHUB_REF is the release's tag, so a ref check
  # would also work -- but only if every tag happens to match the pattern.
  # Keying on the event itself says what we actually mean and cannot drift
  # if a tag is ever named differently.
  #
  # Each of these four jobs' `if:` starts with `success()`. That is not
  # decorative: a job-level `if:` REPLACES GitHub's default "all `needs`
  # jobs succeeded" check rather than ANDing with it, so without an explicit
  # success() here, a failed `test` (or `web`, for `docker`; or `desktop`,
  # for `release`) would NOT stop these jobs from running on a release or
  # dispatch -- only the release/dispatch part of the expression would gate
  # them. success() restores the normal "don't run after an upstream
  # failure" behaviour on top of that gate.
  desktop:
    needs: test
    if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: asteroids-linux
            path: dist/asteroids-linux
          - os: windows-latest
            artifact: asteroids-windows
            path: dist/asteroids-windows.exe
          - os: macos-latest
            artifact: asteroids-macos
            path: dist/asteroids-macos.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --all-groups

      - name: Build binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pyinstaller --onefile --name asteroids main.py
          mv dist/asteroids dist/asteroids-linux

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          uv run pyinstaller --onefile --windowed --name asteroids main.py
          mv dist/asteroids.exe dist/asteroids-windows.exe

      - name: Build binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          uv run pyinstaller --onefile --windowed --name Asteroids main.py
          hdiutil create -volname Asteroids -srcfolder dist/Asteroids.app \
            -ov -format UDZO dist/asteroids-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    needs: desktop
    # Only attach binaries to an actual published Release. On
    # workflow_dispatch there is no release to attach them to, so this job is
    # skipped entirely rather than left to fail -- a dispatch dry run still
    # exercises test -> desktop (and separately web -> docker) and just stops
    # short of publishing anything. success() (see the note above `desktop`)
    # makes sure a failed `desktop` leg still stops `release` on a real
    # release, same as plain `needs` would without a custom `if:`.
    if: success() && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: asteroids-*
          merge-multiple: true

      # Upload to the release that already exists, rather than creating one.
      # This is deliberately `gh release upload` and not an action that
      # creates-or-updates a release: you wrote the release notes by hand
      # when you published it, and anything that regenerates them would
      # overwrite your text. This only ever adds assets.
      #
      # --clobber makes a re-run idempotent: if you re-run this workflow on
      # the same release (say one matrix leg failed and you fixed it), the
      # existing assets are replaced instead of erroring on a name clash.
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber --repo "${{ github.repository }}"

  web:
    needs: test
    if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: scripts/build_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

  docker:
    needs: web
    # Explicit, not just inherited from `needs`: a skipped `web` already
    # skips `docker` by default (a job depending on a skipped job is itself
    # skipped unless its own `if` says otherwise), but stating the same
    # condition here keeps the release-or-dispatch gate obvious without
    # relying on that implicit behaviour, and keeps this job in lockstep with
    # `web` so `download-artifact` below never runs against a run where `web`
    # didn't produce anything. success() (see the note above `desktop`) also
    # makes sure a failed `web` still stops `docker`, since our own `if:`
    # would otherwise override that default protection.
    if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same safety property as the "Trigger Portainer redeploy" step below:
      # deploy/docker-compose.yml pins the `latest` tag, so moving it must
      # require a deliberate published Release, not just any trigger that
      # reaches this job. `enable` gates `latest` on the release event, so a
      # workflow_dispatch dry run (from any branch) never repoints `latest`
      # at unreleased code.
      #
      # The version tag is taken from the release payload explicitly rather
      # than via `type=ref,event=tag`: that rule keys off a tag *push* event,
      # and we no longer trigger on tag pushes at all. Reading
      # github.event.release.tag_name is unambiguous about where the version
      # comes from.
      #
      # `type=sha` matches unconditionally (branch or release), so every
      # trigger that reaches this job always has at least one concrete,
      # non-latest tag to build and push -- which is what actually
      # "validates the image build" on a dispatch, where both of the other
      # two rules are disabled.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Only redeploy the Pi on a real published Release. workflow_dispatch
      # exists so the whole pipeline (test -> web -> docker build/push) can
      # be dry-run beforehand, but a manual "Run workflow" click must never
      # be able to force a production redeploy on someone's Raspberry Pi.
      # Gating on the release event means: dry runs still validate that the
      # image builds and pushes to GHCR, they just don't flip the Pi over to
      # it. Only publishing a Release triggers the webhook.
      # Timeouts match the trackfoundry stack's deploy workflow: without
      # them a hung Portainer endpoint would keep this job alive until
      # GitHub's 6-hour limit instead of failing in half a minute.
      - name: Trigger Portainer redeploy
        if: github.event_name == 'release'
        run: curl -fsSL --connect-timeout 10 --max-time 30 -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
