# Cache for the /cdn/ reverse proxy below. Must live outside any server{}
# block (proxy_cache_path is an http-context directive); this file is
# spliced into http{} via the stock nginx:alpine include, so top-level
# directives here are valid. The directory itself is created and chowned to
# the nginx user in docker/Dockerfile -- nginx does not create it for you.
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:10m
                  max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browsers refuse to stream-compile WASM served as octet-stream, so the
    # common types are listed explicitly. A nested `types` block REPLACES
    # nginx's inherited mime.types map rather than extending it, so .js/.css
    # must be listed here too or they silently fall back to
    # application/octet-stream. Verified with curl in task-10-report.md.
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js;
        application/wasm          wasm;
        application/octet-stream  apk;
        image/png                 png;
        image/svg+xml             svg;
        application/json          json;
    }
    default_type application/octet-stream;

    # The Python runtime is ~10MB raw, ~3MB gzipped. text/html is
    # deliberately omitted from gzip_types: nginx always compresses
    # text/html when gzip is on, and listing it explicitly here only
    # produces a harmless but noisy "duplicate MIME type" warning at
    # startup.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css
               application/json application/octet-stream;

    # Deliberately NOT setting Cross-Origin-Opener-Policy /
    # Cross-Origin-Embedder-Policy here. COEP: require-corp blocks any
    # subresource that lacks its own CORP header -- including everything
    # fetched from the pygame-web.github.io CDN below -- and pygbag's
    # bundle does not need SharedArrayBuffer to run. Adding those headers
    # turns a working page into a broken one; see task-10-report.md.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- CDN reverse proxy -------------------------------------------------
    #
    # pygbag's in-WASM Python package loader resolves wheel paths from
    # https://pygame-web.github.io/cdn/index-0.9.3-cp312.json against this
    # *server's own origin* at "/cdn/..." instead of honoring the index
    # JSON's own "-CDN-" key. That default ("/cdn/" on the page's own host)
    # is pygbag's dev-server convention, where `pygbag main.py` proxies
    # /cdn/ to the real CDN for you. In production there is no such proxy
    # unless we add one -- so without this block the browser requests e.g.
    # http://<this-host>/cdn/cp312/pygame_ce-2.5.7-...whl, gets nothing, and
    # the game never finishes loading pygame_ce (blank page, "Failed to
    # fetch" in the console).
    #
    # DNS resolution: proxy_pass targets a variable ($cdn_upstream), not a
    # bare literal hostname, specifically so nginx re-resolves
    # pygame-web.github.io (served via GitHub's Fastly edge, whose IPs are
    # not guaranteed stable) through the `resolver` directive on every
    # cache-TTL interval rather than once at worker startup. A literal
    # `proxy_pass https://pygame-web.github.io/cdn/;` is simpler and would
    # have been fine for a container that gets redeployed often, but this
    # image is meant to run unattended for a while (Tasks 11/12), so paying
    # a few extra lines for resolver-driven re-resolution buys real
    # robustness against upstream IP changes without needing a restart.
    #
    # Tried Docker's embedded DNS (127.0.0.11) first; it only listens on
    # user-defined Docker networks, not the default `bridge` network this
    # container runs on in the task-10 smoke test (confirmed: connection
    # refused, see task-10-report.md), so it isn't reliably present across
    # however this image ends up deployed. Using a public resolver instead
    # is more portable: this proxy already requires outbound internet
    # access to reach pygame-web.github.io, so depending on 1.1.1.1/8.8.8.8
    # being reachable adds no new constraint, and it works the same
    # whether this container lands on a default bridge network, a
    # user-defined one, or a non-Docker host entirely. ipv6=off avoids
    # stalling on AAAA lookups in IPv4-only environments.
    location /cdn/ {
        resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        set $cdn_upstream https://pygame-web.github.io;

        # $request_uri is the raw, unmodified original request URI. Because
        # this location's prefix (/cdn/) is identical to the upstream's own
        # path prefix (pygame-web.github.io/cdn/...), forwarding it verbatim
        # needs no rewriting -- /cdn/foo on this server becomes
        # https://pygame-web.github.io/cdn/foo upstream.
        proxy_pass $cdn_upstream$request_uri;

        proxy_ssl_server_name on;
        proxy_set_header Host pygame-web.github.io;
        proxy_http_version 1.1;

        # Optional but a genuine win: the runtime (interpreter + pygame_ce
        # wheel) is ~20MB per cold visitor and is immutable per pygbag
        # version, so disk-caching proxied responses on this container
        # avoids re-fetching them from GitHub Pages for every visitor. Kept
        # deliberately simple: cache any 200/302 for a week, serve stale on
        # upstream errors so a transient GitHub Pages hiccup doesn't break
        # already-cached assets.
        proxy_cache cdn_cache;
        proxy_cache_valid 200 302 7d;
        proxy_cache_use_stale error timeout updating
                               http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
