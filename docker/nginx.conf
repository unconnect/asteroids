server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browsers refuse to stream-compile WASM served as octet-stream, so the
    # common types are listed explicitly. A nested `types` block REPLACES
    # nginx's inherited mime.types map rather than extending it, so .js/.css
    # must be listed here too or they silently fall back to
    # application/octet-stream. Confirmed with curl against a running
    # container: with only html/wasm/apk listed, requests for .js and .css
    # came back Content-Type: application/octet-stream, which browsers
    # refuse to execute as a script or apply as a stylesheet.
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js;
        application/wasm          wasm;
        application/octet-stream  apk;
        image/png                 png;
        image/svg+xml             svg;
        application/json          json;
    }
    default_type application/octet-stream;

    # The Python runtime is ~10MB raw, ~3MB gzipped. text/html is
    # deliberately omitted from gzip_types: nginx always compresses
    # text/html when gzip is on, and listing it explicitly here only
    # produces a harmless but noisy "duplicate MIME type" warning at
    # startup.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css
               application/json;
    # application/octet-stream deliberately excluded: the only file served
    # with that type is the .apk, which is already a compressed ZIP
    # archive. Gzipping it again wastes CPU (real concern on a Pi) for
    # zero size benefit.

    # Deliberately NOT setting Cross-Origin-Opener-Policy /
    # Cross-Origin-Embedder-Policy here. COEP: require-corp blocks any
    # subresource that lacks its own CORP header, and pygbag's bundle does
    # not need SharedArrayBuffer to run. Adding those headers turns a
    # working page into a broken one: pygame-web.github.io's CDN responses
    # (loader JS, the WASM interpreter, the pygame-ce wheel) carry no
    # Cross-Origin-Resource-Policy header, so COEP would block every one of
    # them at fetch time, for zero benefit since nothing here uses
    # SharedArrayBuffer.

    # No SPA-style fallback: this deployment serves a single pygbag page
    # with no client-side router and no virtual routes, so falling back to
    # /index.html on a miss buys nothing -- it only makes a missing asset
    # indistinguishable from a healthy load at the HTTP-status level. If a
    # future build omitted or renamed the .apk, curl and any status-code
    # healthcheck would report 200 and the failure would only surface as a
    # blank page in a browser. An honest 404 is worth more here than a
    # fallback nobody needs.
    location / {
        try_files $uri $uri/ =404;
    }
}
