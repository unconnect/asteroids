[project]
name = "asteroids"
version = "0.1.0"
description = "Classic Asteroids, playable in the browser and on the desktop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame==2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pygbag>=0.9.2",
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
